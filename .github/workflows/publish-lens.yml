# Автопубликация read-линзы на orphan-ветку lens-dist при каждом изменении main.
# Потребитель (read-only, напр. бот «Сова») тянет её:
#   git clone --single-branch --branch lens-dist --depth 1 <этот-репо> lens
#
# ТРЕБУЕТСЯ РАЗОВО (иначе checkout приватного сабмодуля tools/ упадёт):
#   1. Settings → Actions → включить Actions для репо.
#   2. Создать секрет LENS_TOKEN — fine-grained PAT с доступом к ДВУМ репо:
#        • HubEx.API.Pipeline (приватный сабмодуль tools/): Contents → Read
#        • этот репо (push ветки lens-dist):               Contents → Read and write
#      Settings → Secrets and variables → Actions → New repository secret → LENS_TOKEN.
name: publish read-lens

on:
  push:
    branches: [main]

# GITHUB_TOKEN здесь не используется для push — пушит LENS_TOKEN (см. checkout ниже),
# но объявляем write на случай, если политика репо требует явных прав.
permissions:
  contents: write

# не запускать две публикации внахлёст; последняя важнее промежуточных
concurrency:
  group: publish-lens
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout контента (сабмодули инициализируем вручную — cli не нужен)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LENS_TOKEN }}  # write сюда (push lens-dist)

      # Инициализируем ТОЛЬКО tools/ (код пайплайна + снапшоты). cli не трогаем: он не нужен
      # для линзы, а LENS_TOKEN к нему прав не имеет (recursive падал бы на cli с 403).
      # -c extraheader — тот же механизм авторизации сабмодуля, что и у actions/checkout;
      # инлайн, не персистит, не мешает push origin в шаге ниже (там свой auth от checkout).
      - name: Инициализировать сабмодуль tools/
        env:
          GH_AUTH: ${{ secrets.LENS_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_AUTH" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              submodule update --init --depth 1 tools

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Runtime-зависимость (цепочка импорта api_cli тянет requests)
        run: pip install requests

      - name: Собрать и опубликовать линзу на ветку lens-dist
        # identity коммита-выкладки задаёт деплой (в CI нет ambient git config); git берёт
        # эти env поверх конфига. Локально identity берётся из git config мейнтейнера.
        env:
          GIT_AUTHOR_NAME: HubEx lens bot
          GIT_AUTHOR_EMAIL: lens-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: HubEx lens bot
          GIT_COMMITTER_EMAIL: lens-bot@users.noreply.github.com
        run: python3 tools/api_cli.py publish-lens
